  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-autocheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autocheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AEGIS repository secret guard
        run: python3 scripts/aegis_secret_guard.py --repo-root .

      - name: Run AEGIS secret-guard regression tests
        run: python3 scripts/test_aegis_secret_guard.py

      - name: Run AEGIS pipeline regression tests
        run: python3 scripts/test_aegis_pipeline.py

      - name: Run AEGIS scheduler regression tests
        run: python3 scripts/test_aegis_scheduler.py

      - name: Run AEGIS real-cycle regression tests
        run: python3 scripts/test_aegis_real_cycle.py

      - name: Run AEGIS local deploy regression tests
        run: python3 scripts/test_aegis_deploy_local.py

      - name: Run AEGIS remote retry regression tests
        run: python3 scripts/test_aegis_remote_apply_retry.py

      - name: Run AEGIS Tailscale bridge regression tests
        run: python3 scripts/test_aegis_tailscale_bridge.py

      - name: Run AEGIS runner control regression tests
        run: python3 scripts/test_aegis_runner_control.py

      - name: Run AEGIS access bootstrap regression tests
        run: python3 scripts/test_aegis_access_bootstrap.py

      - name: Run AEGIS GitHub bootstrap regression tests
        run: python3 scripts/test_aegis_bootstrap_from_github.py

      - name: Run AEGIS pull-control regression tests
        run: python3 scripts/test_aegis_pull_control.py

      - name: Run AEGIS zero-cost bootstrap regression tests
        run: python3 scripts/test_aegis_zero_cost_bootstrap.py

      - name: Run AEGIS iPhone a-Shell bootstrap regression tests
        run: python3 scripts/test_aegis_iphone_ashell_bootstrap.py

      - name: Run AEGIS native Shortcuts launcher regression tests
        run: python3 scripts/test_aegis_shortcuts_remote_launcher.py

      - name: Run AEGIS coder-router regression tests
        run: python3 scripts/test_aegis_coder_router.py

      - name: Run AEGIS coder boot guardian regression tests
        run: python3 scripts/test_aegis_coder_boot.py

      - name: Run AEGIS local Codex OSS regression tests
        run: python3 scripts/test_aegis_codex_oss.py

      - name: Run AEGIS user persistence regression tests
        run: python3 scripts/test_aegis_user_persistence.py

      - name: Run AEGIS real-status regression tests
        run: python3 scripts/test_aegis_real_status.py

      - name: Run AEGIS project continuity regression tests
        run: python3 scripts/test_aegis_project_context.py

      - name: Run AEGIS MCP runtime regression tests
        run: python3 scripts/test_aegis_mcp_runtime.py

      - name: Run AEGIS Docker efficiency regression tests
        run: python3 scripts/test_aegis_docker_efficiency.py

      - name: Run AEGIS AUTO-MAX-LOCAL autonomy regression tests
        run: python3 scripts/test_aegis_autonomy.py

      - name: Run AEGIS service lifecycle regression tests
        run: python3 scripts/test_aegis_service_lifecycle.py

      - name: Validate hardened shell syntax
        run: bash -n scripts/aegis_nas_bootstrap.sh scripts/aegis_nas_run_once.sh scripts/aegis_scheduled_run.sh scripts/aegis_scheduler_install.sh scripts/aegis_deploy_local.sh scripts/aegis_remote_apply_retry.sh scripts/aegis_tailscale_bridge.sh scripts/aegis_runner_install.sh scripts/aegis_access_bootstrap.sh scripts/aegis_bootstrap_from_github.sh scripts/aegis_pull_control_install.sh scripts/aegis_zero_cost_bootstrap.sh scripts/aegis_iphone_ashell_bootstrap.sh scripts/aegis_shortcuts_remote_launcher.sh scripts/aegis_coder_router.sh scripts/aegis_coder_boot_guard.sh scripts/aegis_coder_boot_install.sh scripts/aegis_codex_oss_install.sh scripts/aegis_user_persistence.sh scripts/aegis_mcp_runtime_install.sh scripts/aegis_docker_efficiency_install.sh scripts/aegis_autonomy_install.sh scripts/aegis_service_lifecycle_install.sh scripts/aegis_export_collect.sh scripts/aegis_source_detect.sh

      - name: Run AEGIS guardian regression tests
        run: python3 scripts/test_aegis_guardian.py

      - name: Run AEGIS provenance regression tests
        run: python3 scripts/test_aegis_provenance.py

      - name: Run AEGIS last-known-good regression tests
        run: python3 scripts/test_aegis_last_known_good.py

      - name: Run AEGIS local AI miner regression tests
        run: python3 scripts/test_aegis_local_ai_miner.py

      - name: Run AEGIS model-agent matrix regression tests
        run: python3 scripts/test_aegis_model_agent_matrix.py

      - name: Run AEGIS learning gate regression tests
        run: python3 scripts/test_aegis_learning_gate.py

      - name: Compile guardian, deploy, retry, runner, tunnel, access, real-cycle, real-status, provenance, LKG, miner, matrix, gate and MCP modules
        run: python3 -m py_compile scripts/aegis_guardian_cycle.py scripts/aegis_real_cycle.py scripts/aegis_real_status.py scripts/aegis_secret_guard.py scripts/aegis_provenance.py scripts/aegis_last_known_good.py scripts/aegis_local_ai_miner.py scripts/aegis_model_agent_matrix.py scripts/aegis_learning_gate.py scripts/aegis_project_context.py scripts/aegis_docker_efficiency.py scripts/aegis_autonomy_supervisor.py scripts/aegis_service_lifecycle.py scripts/aegis_mcp_server.py scripts/test_aegis_guardian.py scripts/test_aegis_secret_guard.py scripts/test_aegis_deploy_local.py scripts/test_aegis_remote_apply_retry.py scripts/test_aegis_tailscale_bridge.py scripts/test_aegis_runner_control.py scripts/test_aegis_access_bootstrap.py scripts/test_aegis_bootstrap_from_github.py scripts/aegis_pull_control.py scripts/test_aegis_pull_control.py scripts/test_aegis_zero_cost_bootstrap.py scripts/test_aegis_iphone_ashell_bootstrap.py scripts/test_aegis_shortcuts_remote_launcher.py scripts/test_aegis_coder_router.py scripts/test_aegis_coder_boot.py scripts/test_aegis_codex_oss.py scripts/test_aegis_user_persistence.py scripts/test_aegis_project_context.py scripts/test_aegis_mcp_runtime.py scripts/test_aegis_docker_efficiency.py scripts/test_aegis_autonomy.py scripts/test_aegis_service_lifecycle.py scripts/test_aegis_real_cycle.py scripts/test_aegis_real_status.py scripts/test_aegis_provenance.py scripts/test_aegis_last_known_good.py scripts/test_aegis_local_ai_miner.py scripts/test_aegis_model_agent_matrix.py scripts/test_aegis_learning_gate.py

      - name: Validate MCP v2 module
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check "mcp[cli]>=2,<3"
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('scripts/aegis_mcp_server.py')
          spec = importlib.util.spec_from_file_location('aegis_mcp_server', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          from mcp.server import MCPServer
          if not isinstance(mod.mcp, MCPServer):
              raise SystemExit('mcp object is not an MCPServer')
          for name in ('guardian_status', 'local_ai_inventory', 'model_agent_matrix', 'learning_gate_status', 'active_state_status', 'activate_last_known_good', 'provisional_learning_status', 'record_probation_result', 'last_known_good_status', 'restore_last_known_good', 'learning_cards', 'project_context', 'project_context_packet', 'project_continuity_check', 'record_project_handoff', 'primary_control_status', 'service_lifecycle_status', 'autonomy_status', 'autonomy_policy', 'enqueue_autonomy_task', 'run_autonomy_cycle', 'run_guardian_cycle'):
              if not callable(getattr(mod, name, None)):
                  raise SystemExit(f'MCP callable missing: {name}')
          import os
          os.environ.pop('AEGIS_LKG_MCP_TARGET', None)
          blocked = mod.restore_last_known_good()
          if blocked.get('status') != 'blocked' or blocked.get('reason') != 'mcp-rollback-target-not-configured':
              raise SystemExit(f'MCP rollback fail-closed contract broken: {blocked}')
          os.environ.pop('AEGIS_LKG_ACTIVATION_TARGET', None)
          blocked_activation = mod.activate_last_known_good()
          if blocked_activation.get('status') != 'blocked' or blocked_activation.get('reason') != 'activation-target-not-configured':
              raise SystemExit(f'MCP activation fail-closed contract broken: {blocked_activation}')
          print('AEGIS MCP v2 public import, rollback and activation contract OK')
          PY

      - name: Detect real score data
        id: detect
        shell: bash
        run: |
          if [[ -f scores/latest.json ]]; then
            echo 'has_data=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_data=false' >> "$GITHUB_OUTPUT"
            echo 'AEGIS_AUTOCHECK status=no_data'
          fi

      - name: Require complete export envelope
        if: steps.detect.outputs.has_data == 'true'
        shell: bash
        run: |
          test -s scores/export-session.json || { echo 'Missing scores/export-session.json' >&2; exit 1; }
          test -s scores/manifest.sha256 || { echo 'Missing scores/manifest.sha256' >&2; exit 1; }

      - name: Validate score snapshot
        if: steps.detect.outputs.has_data == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('scores/latest.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          required = ('generated_at', 'network_score', 'devices')
          missing = [k for k in required if k not in d]
          if missing:
              raise SystemExit(f'missing required fields: {missing}')
          score = d['network_score']
          if not isinstance(score, (int, float)) or isinstance(score, bool) or not (0 <= float(score) <= 100):
              raise SystemExit('network_score must be numeric 0..100')
          if not isinstance(d['devices'], list):
              raise SystemExit('devices must be a list')
          for i, dev in enumerate(d['devices']):
              if not isinstance(dev, dict):
                  raise SystemExit(f'devices[{i}] must be an object')
              if 'id' not in dev or 'score' not in dev:
                  raise SystemExit(f'devices[{i}] missing id/score')
              s = dev['score']
              if not isinstance(s, (int, float)) or isinstance(s, bool) or not (0 <= float(s) <= 100):
                  raise SystemExit(f'devices[{i}].score must be numeric 0..100')
          print('AEGIS schema baseline validation OK')
          PY

      - name: Verify exported hashes
        if: steps.detect.outputs.has_data == 'true'
        shell: bash
        run: (cd scores && sha256sum -c manifest.sha256)

      - name: Run AEGIS deep autocheck
        if: steps.detect.outputs.has_data == 'true'
        run: python3 scripts/aegis_repo_autocheck.py


  publish-generated:
    if: github.event_name == 'push'
    needs: autocheck
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Detect real score data
        id: detect-publish
        shell: bash
        run: |
          if [[ -f scores/latest.json ]]; then
            echo 'has_data=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_data=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild generated diagnosis
        if: steps.detect-publish.outputs.has_data == 'true'
        run: python3 scripts/aegis_repo_autocheck.py

      - name: Commit generated diagnosis and fix package
        if: steps.detect-publish.outputs.has_data == 'true'
        shell: bash
        run: |
          git config user.name 'aegis-autocheck[bot]'
          git config user.email 'aegis-autocheck@users.noreply.github.com'
          for path in dashboard/autocheck.json fixes/done/fix-package-002.json; do
            if [[ -e "$path" ]] || git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              git add -A -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'AEGIS autocheck: update diagnosis artifacts'
          git push
