name: AEGIS FRITZBox Live Gate

on:
  push:
    branches:
      - aegis/fritzbox-autoprotect-ai-block0
    paths:
      - 'modules/fritzbox-autoprotect-ai/**'
      - '.github/workflows/aegis-fritzbox-live-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-gate:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modules/fritzbox-autoprotect-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated Python environment
        shell: bash
        run: |
          python3 -m venv .venv-live
          .venv-live/bin/python -m pip install -e .

      - name: Prepare local-only runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -r /etc/aegis/fritzbox-autoprotect.env ]]; then
            set -a
            source /etc/aegis/fritzbox-autoprotect.env
            set +a
          fi
          mkdir -p "$RUNNER_TEMP/aegis-autoprotect-state"
          cat > "$RUNNER_TEMP/aegis-autoprotect-live.toml" <<EOF
          [core]
          mode = "observe"
          apply_enabled = false
          min_apply_score = 90.0
          required_stable_cycles = 3
          state_dir = "$RUNNER_TEMP/aegis-autoprotect-state"

          [fritzbox]
          base_url = "http://fritz.box:49000"
          username = "${AEGIS_FRITZ_USER:-}"
          password_env = "AEGIS_FRITZ_PASSWORD"
          timeout_seconds = 8
          verify_tls = false
          max_hosts = 256
          max_port_mappings = 256

          [models]
          ollama_url = "http://127.0.0.1:11434"
          allow_remote = false

          [gates]
          block_0 = 70.0
          EOF

      - name: Run privacy-safe live gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -r /etc/aegis/fritzbox-autoprotect.env ]]; then
            set -a
            source /etc/aegis/fritzbox-autoprotect.env
            set +a
          fi
          .venv-live/bin/python live_gate.py --config "$RUNNER_TEMP/aegis-autoprotect-live.toml"
