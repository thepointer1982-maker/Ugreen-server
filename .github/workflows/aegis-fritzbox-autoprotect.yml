name: AEGIS FRITZBox AutoProtect

on:
  push:
    branches: [main]
    paths:
      - 'modules/fritzbox-autoprotect-ai/**'
      - '.github/workflows/aegis-fritzbox-autoprotect.yml'
  pull_request:
    paths:
      - 'modules/fritzbox-autoprotect-ai/**'
      - '.github/workflows/aegis-fritzbox-autoprotect.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-fritzbox-autoprotect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  block0:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/fritzbox-autoprotect-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Compile
        run: python -m compileall -q block0.py mcp_server.py

      - name: Unit tests
        run: pytest -q

      - name: Verify safe defaults
        run: |
          python - <<'PY'
          from block0 import Config, validate_config
          cfg = Config()
          validate_config(cfg)
          assert cfg.mode == "observe"
          assert cfg.apply_enabled is False
          assert cfg.allow_remote_models is False
          print("AEGIS AutoProtect safe defaults OK")
          PY
