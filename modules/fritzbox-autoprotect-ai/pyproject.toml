[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-fritzbox-autoprotect-ai"
version = "0.1.0"
description = "Local-first AEGIS FRITZ!Box security observer, score gate and MCP server"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
mcp = ["mcp[cli]>=2,<3"]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
